openapi: 3.1.2
info:
  title: Synodus Core API
  version: 1.0.0
  description: >-
    The reviewed v1 browser API contract. Organization, team, and task
    operations remain dark until the D06 route cutover.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
  - name: Authentication
  - name: Organizations
  - name: Teams
  - name: Tasks
  - name: Chat
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create a local account and browser session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example: {display_name: Researcher, email: researcher@example.com, password: correct-horse-battery-staple}
      responses:
        '201':
          description: Account and session created
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
              examples: {standard: {$ref: '#/components/examples/AuthResponse'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: researcher@example.com, password: correct-horse-battery-staple}
      responses:
        '200':
          description: Session created
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
              examples: {standard: {$ref: '#/components/examples/AuthResponse'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: Inspect the current browser session
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
              examples: {standard: {$ref: '#/components/examples/AuthResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      tags: [Authentication]
      operationId: logout
      summary: Revoke or clear the current browser session
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Session revoked or absent cookie cleared}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/auth/sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      summary: List the user's bounded session collection
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionCollection'}
              example:
                sessions:
                  - {id: 44444444-4444-4444-8444-444444444444, user_agent: Example Browser, created_at: '2026-08-27T09:00:00Z', last_seen_at: '2026-08-27T09:05:00Z', idle_expires_at: '2026-08-27T09:35:00Z', absolute_expires_at: '2026-08-27T21:00:00Z', current: true}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      tags: [Authentication]
      operationId: revokeAllSessions
      summary: Revoke all sessions for the user
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Sessions revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [Authentication]
      operationId: revokeSession
      summary: Revoke one session belonging to the user
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/SessionID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/auth/password:
    put:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the current user's password and rotate the session
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordRequest'}
            example: {current_password: old-correct-password, new_password: new-correct-password}
      responses:
        '200':
          description: Password changed and session rotated
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
              examples: {standard: {$ref: '#/components/examples/AuthResponse'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List organizations visible to the user
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Organization page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationPage'}
              example:
                items:
                  - {id: 11111111-1111-4111-8111-111111111111, name: Applied Systems Lab, lifecycle_state: active, created_at: '2026-08-27T09:00:00Z', updated_at: '2026-08-27T09:00:00Z', deleted_at: null}
                next_cursor: null
                previous_cursor: null
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationWrite'}
            example: {name: Applied Systems Lab}
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
              examples: {standard: {$ref: '#/components/examples/Organization'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
              examples: {standard: {$ref: '#/components/examples/Organization'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Rename an organization
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationWrite'}
            example: {name: Applied Systems Laboratory}
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
              examples: {standard: {$ref: '#/components/examples/Organization'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      summary: Soft-delete an organization
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Organization deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/restore:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    post:
      tags: [Organizations]
      operationId: restoreOrganization
      summary: Restore a soft-deleted organization
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '200':
          description: Organization restored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
              examples: {standard: {$ref: '#/components/examples/Organization'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/teams:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Teams]
      operationId: listTeams
      summary: List teams in an organization
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Team page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamPage'}
              example:
                items:
                  - {id: 22222222-2222-4222-8222-222222222222, name: Reproducibility Group, slug: reproducibility-group, created_at: '2026-08-27T09:00:00Z', updated_at: '2026-08-27T09:00:00Z'}
                next_cursor: null
                previous_cursor: null
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a team
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamWrite'}
            example: {name: Reproducibility Group}
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
              examples: {standard: {$ref: '#/components/examples/Team'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/invitations:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      operationId: listOrganizationInvitations
      security: [{sessionCookie: []}]
      responses: {'200': {description: Pending invitations}}
    post:
      operationId: createOrganizationInvitation
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}
      responses: {'201': {description: Invitation created}}
  /api/v1/orgs/{org_id}/members:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      operationId: listOrganizationMembers
      security: [{sessionCookie: []}]
      responses: {'200': {description: Organization members}}
  /api/v1/orgs/{org_id}/invitations/{invitation_id}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: invitation_id, in: path, required: true, schema: {$ref: '#/components/schemas/PublicID'}}
    delete:
      operationId: revokeOrganizationInvitation
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Invitation revoked}}
  /api/v1/organization-invitations/current:
    get:
      operationId: getCurrentOrganizationInvitation
      parameters: [{$ref: '#/components/parameters/InvitationToken'}]
      responses: {'200': {description: Invitation preview}}
    delete:
      operationId: declineCurrentOrganizationInvitation
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/InvitationToken'}
      responses: {'204': {description: Invitation declined}}
  /api/v1/organization-invitations/current/accept:
    post:
      operationId: acceptCurrentOrganizationInvitation
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/InvitationToken'}
      responses: {'200': {description: Invitation accepted}}
  /api/v1/orgs/{org_id}/teams/{team_id}/members:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/TeamID'}
    get:
      operationId: listTeamMembers
      security: [{sessionCookie: []}]
      responses: {'200': {description: Team members}}
    post:
      operationId: addTeamMember
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}
      responses: {'201': {description: Team member added}}
  /api/v1/orgs/{org_id}/teams/{team_id}/tasks:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/TeamID'}
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks in a team
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Task page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
              example:
                items:
                  - {id: 33333333-3333-4333-8333-333333333333, description: Reproduce benchmark results, status: todo, assignee_id: null, created_at: '2026-08-27T09:00:00Z', updated_at: '2026-08-27T09:00:00Z'}
                next_cursor: null
                previous_cursor: null
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskWrite'}
            example: {description: Reproduce benchmark results, status: todo}
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
              examples: {standard: {$ref: '#/components/examples/Task'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/teams/{team_id}/tasks/{task_id}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/TeamID'}
      - {$ref: '#/components/parameters/TaskID'}
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskWrite'}
            example: {description: Reproduce benchmark results, status: in_progress}
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
              examples: {standard: {$ref: '#/components/examples/Task'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Task deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/resources:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Resources]
      operationId: listResources
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Resources, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCollection'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      tags: [Resources]
      operationId: createResource
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceWrite'}}}}
      responses:
        '201': {description: Resource created, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/resources/{resource_id}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ResourceID'}]
    patch:
      tags: [Resources]
      operationId: updateResource
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourcePatch'}}}}
      responses:
        '200': {description: Resource updated, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      tags: [Resources]
      operationId: deleteResource
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Resource deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/bookings:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Resources]
      operationId: listBookings
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Approved bookings, content: {application/json: {schema: {$ref: '#/components/schemas/BookingCollection'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/resources/{resource_id}/requests:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ResourceID'}]
    post:
      tags: [Resources]
      operationId: createResourceRequest
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceRequestWrite'}}}}
      responses:
        '201': {description: Request submitted, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceRequest'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/resource-requests:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Resources]
      operationId: listResourceRequests
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Visible resource requests, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceRequestCollection'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/orgs/{org_id}/resource-requests/{request_id}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/RequestID'}]
    patch:
      tags: [Resources]
      operationId: decideResourceRequest
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceDecision'}}}}
      responses:
        '200': {description: Request decided, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceRequest'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/auth/public-key:
    put:
      tags: [Authentication]
      operationId: upsertPublicKey
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: {type: string}
      responses:
        '200':
          description: Public key registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: {type: string}
                  public_key: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalFailure'}
  /api/v1/orgs/{org_id}/teams/{team_id}/members/public-keys:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/TeamID'}]
    get:
      tags: [Teams]
      operationId: getPublicKeysForTeam
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Public keys of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id: {type: string}
                    public_key: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
  /api/v1/orgs/{org_id}/teams/{team_id}/keys:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/TeamID'}]
    post:
      tags: [Teams]
      operationId: upsertTeamSharedKeys
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [user_id, encrypted_key, key_version]
                properties:
                  user_id: {type: string}
                  encrypted_key: {type: string}
                  key_version: {type: integer}
      responses:
        '204': {description: Keys upserted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
    get:
      tags: [Teams]
      operationId: listTeamSharedKeysForUser
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Shared keys of the current user for the team
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    team_id: {type: string}
                    user_id: {type: string}
                    encrypted_key: {type: string}
                    key_version: {type: integer}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
  /api/v1/orgs/{org_id}/teams/{team_id}/files:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/TeamID'}]
    post:
      tags: [Teams]
      operationId: uploadFile
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, key_version, iv, file]
              properties:
                name: {type: string}
                key_version: {type: integer}
                iv: {type: string}
                file: {type: string, format: binary}
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  name: {type: string}
                  size: {type: integer}
                  content_type: {type: string}
                  iv: {type: string}
                  key_version: {type: integer}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
    get:
      tags: [Teams]
      operationId: listFiles
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: List of team files
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    name: {type: string}
                    size: {type: integer}
                    content_type: {type: string}
                    iv: {type: string}
                    key_version: {type: integer}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
  /api/v1/orgs/{org_id}/teams/{team_id}/files/{file_id}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/TeamID'}
      - name: file_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/PublicID'}
    get:
      tags: [Teams]
      operationId: downloadFile
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: File stream response
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
    delete:
      tags: [Teams]
      operationId: deleteFile
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: File deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
  /api/v1/orgs/{org_id}/teams/{team_id}/chat/messages:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/TeamID'}]
    get:
      tags: [Chat]
      operationId: listChatMessages
      security: [{sessionCookie: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
        - {name: before, in: query, schema: {$ref: '#/components/schemas/Timestamp'}}
      responses:
        '200':
          description: Recent chat messages
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessagePage'}
              examples: {standard: {$ref: '#/components/examples/ChatMessagePage'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
    post:
      tags: [Chat]
      operationId: createChatMessage
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatMessageWrite'}
            example: {message: I pushed the latest notes., mentions: [11111111-1111-4111-8111-111111111111]}
      responses:
        '201':
          description: Chat message created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
              examples: {standard: {$ref: '#/components/examples/ChatMessage'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
  /api/v1/orgs/{org_id}/teams/{team_id}/chat/messages/{message_id}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/TeamID'}
      - {$ref: '#/components/parameters/MessageID'}
    delete:
      tags: [Chat]
      operationId: deleteChatMessage
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '200':
          description: Chat message marked deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
              examples: {standard: {$ref: '#/components/examples/ChatMessage'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
  /api/v1/orgs/{org_id}/teams/{team_id}/chat/socket-ticket:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/TeamID'}]
    post:
      tags: [Chat]
      operationId: issueChatSocketTicket
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '200':
          description: Short lived WebSocket ticket
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocketTicket'}
              example: {token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalFailure'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-synodus_session
      description: Production browser session cookie.
  headers:
    SessionCookie:
      description: HttpOnly, Secure, SameSite=Strict production session cookie.
      schema: {type: string}
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 512}
    InvitationToken:
      name: X-Invitation-Token
      in: header
      required: true
      schema: {type: string, minLength: 43, maxLength: 43}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1, maxLength: 512}
    OrganizationID:
      name: org_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PublicID'}
    TeamID:
      name: team_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PublicID'}
    TaskID:
      name: task_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PublicID'}
    SessionID:
      name: session_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PublicID'}
    ResourceID:
      name: resource_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PublicID'}
    RequestID:
      name: request_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PublicID'}
    MessageID:
      name: message_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PublicID'}
  responses:
    InvalidRequest: {$ref: '#/components/responses/InvalidRequestResponse'}
    Unauthenticated: {$ref: '#/components/responses/UnauthenticatedResponse'}
    Forbidden: {$ref: '#/components/responses/ForbiddenResponse'}
    NotFound: {$ref: '#/components/responses/NotFoundResponse'}
    Conflict: {$ref: '#/components/responses/ConflictResponse'}
    PreconditionFailed: {$ref: '#/components/responses/PreconditionFailedResponse'}
    RateLimited: {$ref: '#/components/responses/RateLimitedResponse'}
    InternalFailure: {$ref: '#/components/responses/InternalFailureResponse'}
    DependencyUnavailable: {$ref: '#/components/responses/DependencyUnavailableResponse'}
    InvalidRequestResponse:
      description: The request is invalid
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/InvalidRequestProblem'}}
    UnauthenticatedResponse:
      description: Authentication is required
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/UnauthenticatedProblem'}}
    ForbiddenResponse:
      description: The authenticated user cannot perform the known operation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/ForbiddenProblem'}}
    NotFoundResponse:
      description: The protected resource is absent or unavailable to the user
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/NotFoundProblem'}}
    ConflictResponse:
      description: The request conflicts with current state
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/ConflictProblem'}}
    PreconditionFailedResponse:
      description: A request precondition did not hold
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/PreconditionFailedProblem'}}
    RateLimitedResponse:
      description: The request rate limit was exceeded
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/RateLimitedProblem'}}
    InternalFailureResponse:
      description: An internal failure occurred
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/InternalProblem'}}
    DependencyUnavailableResponse:
      description: A required dependency is unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples: {standard: {$ref: '#/components/examples/DependencyProblem'}}
  schemas:
    PublicID: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    CursorValue: {type: [string, 'null'], minLength: 1, maxLength: 512}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 1024}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [display_name, email, password]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 15, maxLength: 128}
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024}
        new_password: {type: string, minLength: 1, maxLength: 1024}
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name]
      properties:
        id: {$ref: '#/components/schemas/PublicID'}
        email: {type: string, format: email}
        display_name: {type: string, minLength: 1, maxLength: 200}
    Session:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, idle_expires_at, absolute_expires_at, current]
      properties:
        id: {$ref: '#/components/schemas/PublicID'}
        user_agent: {type: string, maxLength: 512}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        last_seen_at: {$ref: '#/components/schemas/Timestamp'}
        idle_expires_at: {$ref: '#/components/schemas/Timestamp'}
        absolute_expires_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {type: [string, 'null'], format: date-time}
        current: {type: boolean}
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, session, csrf_token]
      properties:
        user: {$ref: '#/components/schemas/User'}
        session: {$ref: '#/components/schemas/Session'}
        csrf_token: {type: string, minLength: 1, maxLength: 512}
    SessionCollection:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Session'}
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, lifecycle_state, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicID'}
        name: {type: string, minLength: 1, maxLength: 200}
        lifecycle_state: {type: string, enum: [provisioning, active, deleting, deleted, restoring, failed]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        deleted_at: {type: [string, 'null'], format: date-time}
    OrganizationWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    Team:
      type: object
      additionalProperties: false
      required: [id, name, slug, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicID'}
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    TeamWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    Task:
      type: object
      additionalProperties: false
      required: [id, description, status, assignee_id, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicID'}
        description: {type: string, minLength: 1, maxLength: 4096}
        status: {type: string, enum: [todo, in_progress, done]}
        assignee_id: {type: [string, 'null'], format: uuid}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    TaskWrite:
      type: object
      additionalProperties: false
      required: [description, status]
      properties:
        description: {type: string, minLength: 1, maxLength: 4096}
        status: {type: string, enum: [todo, in_progress, done]}
        # Absent keeps the current assignee; null unassigns; a value reassigns.
        assignee_id: {type: [string, 'null'], format: uuid}
    ChatSender:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/PublicID'}
        name: {type: string, minLength: 1, maxLength: 200}
        avatar: {type: [string, 'null'], maxLength: 512}
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, team_id, sender, message, mentions, reactions, attachments, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PublicID'}
        team_id: {$ref: '#/components/schemas/PublicID'}
        sender: {$ref: '#/components/schemas/ChatSender'}
        message: {type: string, minLength: 1, maxLength: 4000}
        mentions: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/PublicID'}}
        reactions: {type: array, maxItems: 0}
        attachments: {type: array, maxItems: 0}
        reply_to_id: {type: [string, 'null'], format: uuid}
        deleted_at: {type: [string, 'null'], format: date-time}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ChatMessageWrite:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 4000}
        reply_to_id: {type: [string, 'null'], format: uuid}
        mentions: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/PublicID'}}
    ChatMessagePage:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ChatMessage'}}
    SocketTicket:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 32, maxLength: 4096}
    AvailabilityWindow:
      type: object
      additionalProperties: false
      required: [weekday, start, end]
      properties:
        weekday: {type: integer, minimum: 0, maximum: 6}
        start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        end: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    ResourceWrite:
      type: object
      additionalProperties: false
      required: [name, code, kind, location, enabled, availability]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        code: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, enum: [gpu, instrument, room, workstation]}
        location: {type: string, maxLength: 255}
        enabled: {type: boolean}
        availability: {type: array, maxItems: 7, items: {$ref: '#/components/schemas/AvailabilityWindow'}}
    ResourcePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        code: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, enum: [gpu, instrument, room, workstation]}
        location: {type: string, maxLength: 255}
        enabled: {type: boolean}
        availability: {type: array, maxItems: 7, items: {$ref: '#/components/schemas/AvailabilityWindow'}}
    Resource:
      allOf:
        - {$ref: '#/components/schemas/ResourceWrite'}
        - {type: object, required: [id], properties: {id: {$ref: '#/components/schemas/PublicID'}}}
    Booking:
      type: object
      additionalProperties: false
      required: [id, resource_id, resource_name, start_time, end_time, details_visible, team_public_id, team_name, requested_by_name, purpose]
      properties:
        id: {$ref: '#/components/schemas/PublicID'}
        resource_id: {$ref: '#/components/schemas/PublicID'}
        resource_name: {type: string}
        start_time: {$ref: '#/components/schemas/Timestamp'}
