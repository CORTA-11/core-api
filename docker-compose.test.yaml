services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration-password
      POSTGRES_DB: core_api_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d core_api_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.8.1
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: integration
      MINIO_ROOT_PASSWORD: integration-password
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
